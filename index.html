<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Share Your Photos</title>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --bg:#f6f4ef; --surface:#ffffff; --text:#1d1b18; --muted:#6b665d; --line:#e4dfd4;
    --accent:#1f5f4a; --accent-text:#ffffff; --ok:#1f7a4d; --err:#b3261e;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#141311; --surface:#1e1c19; --text:#f2efe8; --muted:#a39d92; --line:#34312c;
      --accent:#5fb393; --accent-text:#0f1a15; --ok:#6fcf97; --err:#f28b82;
    }
  }
  :root[data-theme="dark"]{
    --bg:#141311; --surface:#1e1c19; --text:#f2efe8; --muted:#a39d92; --line:#34312c;
    --accent:#5fb393; --accent-text:#0f1a15; --ok:#6fcf97; --err:#f28b82;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
       padding:max(24px,env(safe-area-inset-top)) 16px max(32px,env(safe-area-inset-bottom))}
  main{max-width:480px;margin:0 auto}
  .eyebrow{margin:0;color:var(--accent);font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
  h1{margin:4px 0 4px;font-size:30px;line-height:1.15;font-weight:700;text-wrap:balance}
  .sub{margin:0 0 24px;color:var(--muted)}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
  label.field{display:block;font-weight:600;margin-bottom:6px}
  label.field span{font-weight:400;color:var(--muted)}
  input[type=text]{width:100%;font:inherit;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
  input[type=text]:focus{outline:2px solid var(--accent);outline-offset:1px}
  .hint{margin:8px 0 0;font-size:14px;color:var(--muted)}
  .actions{display:grid;gap:12px;margin-bottom:16px}
  .btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;border-radius:14px;font-weight:600;font-size:17px;
       border:1px solid var(--line);background:var(--surface);color:var(--text);cursor:pointer;user-select:none}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
  .btn:active{transform:scale(.98)}
  .btn svg{width:22px;height:22px}
  .vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
  #status{min-height:1.5em;margin:0 0 12px;font-weight:600}
  #status.ok{color:var(--ok)} #status.err{color:var(--err)}
  ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  li{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--line)}
  li img{width:100%;height:100%;object-fit:cover;display:block}
  li .tag{position:absolute;left:4px;right:4px;bottom:4px;font-size:12px;font-weight:600;text-align:center;padding:3px 4px;border-radius:6px;
          background:rgba(0,0,0,.62);color:#fff}
  li.done .tag{background:rgba(31,122,77,.9)}
  li.failed .tag{background:rgba(179,38,30,.92)}
  li button{position:absolute;inset:0;width:100%;height:100%;background:transparent;border:0;cursor:pointer}
  .count{margin:16px 0 0;color:var(--muted);text-align:center;font-size:14px}
</style>
</head>
<body>
<main>
  <p class="eyebrow">Photo drop</p>
  <h1 id="eventName">Our Event</h1>
  <p class="sub" id="subtitle"></p>

  <section class="card">
    <label class="field" for="guestName">Your name <span>(optional)</span></label>
    <input type="text" id="guestName" autocomplete="name" placeholder="e.g. Annelie" maxlength="40">
    <p class="hint" id="folderHint">So the host knows whose photos these are.</p>
  </section>

  <div class="actions">
    <label class="btn primary">
      <input class="vh" type="file" accept="image/*" capture="environment" id="camera">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
      Take a photo
    </label>
    <label class="btn">
      <input class="vh" type="file" accept="image/*" multiple id="gallery">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg>
      Choose from gallery
    </label>
  </div>

  <p id="status" role="status" aria-live="polite"></p>
  <ul id="queue"></ul>
  <p class="count" id="count"></p>
</main>

<script>
(function(){
  const C = window.EVENT_CONFIG;
  const $ = id => document.getElementById(id);
  $('eventName').textContent = C.EVENT_NAME;
  $('subtitle').textContent = C.EVENT_SUBTITLE || '';
  document.title = C.EVENT_NAME + ' · Share your photos';

  const sb = supabase.createClient(C.SUPABASE_URL, C.SUPABASE_ANON_KEY, { auth: { persistSession: false } });

  // --- per-phone identity (kept in this phone's browser) ---
  const store = {
    get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
    set(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
  };
  const KEY = 'photodrop:' + C.BUCKET + ':' + C.EVENT_NAME;
  let folder = store.get(KEY + ':folder');
  let count = parseInt(store.get(KEY + ':count') || '0', 10);
  const nameInput = $('guestName');
  nameInput.value = store.get(KEY + ':name') || '';
  nameInput.addEventListener('input', () => store.set(KEY + ':name', nameInput.value.trim()));

  function slug(s){
    return s.normalize('NFKD').replace(/[̀-ͯ]/g,'').toLowerCase()
            .replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40);
  }
  function rand(n){
    const a = 'abcdefghijkmnpqrstuvwxyz23456789';
    return Array.from(crypto.getRandomValues(new Uint8Array(n)), x => a[x % a.length]).join('');
  }
  function ensureFolder(){
    if (!folder){
      folder = (slug(nameInput.value) || 'guest') + '-' + rand(6);
      store.set(KEY + ':folder', folder);
    }
    return folder;
  }
  function renderMeta(){
    if (folder){
      $('folderHint').textContent = 'Your photos are saved together in the folder “' + folder + '”.';
    }
    $('count').textContent = count ? ('You have shared ' + count + ' photo' + (count === 1 ? '' : 's') + '. Thank you!') : '';
  }
  renderMeta();

  // --- optional shrink to save mobile data ---
  async function prepare(file){
    const max = +C.MAX_DIMENSION || 0;
    if (!max || !/^image\/(jpeg|png|webp|heic|heif)$/i.test(file.type)) return file;
    try {
      const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
      const scale = Math.min(1, max / Math.max(bmp.width, bmp.height));
      if (scale === 1 && file.type === 'image/jpeg') { bmp.close && bmp.close(); return file; }
      const cv = document.createElement('canvas');
      cv.width = Math.round(bmp.width * scale); cv.height = Math.round(bmp.height * scale);
      cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
      bmp.close && bmp.close();
      const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.88));
      if (!blob) return file;
      return new File([blob], file.name.replace(/\.[^.]+$/, '') + '.jpg', { type: 'image/jpeg' });
    } catch(e){ return file; }
  }

  function extFor(file){
    const m = /\.([a-z0-9]{2,5})$/i.exec(file.name || '');
    if (m) return m[1].toLowerCase();
    return ({'image/jpeg':'jpg','image/png':'png','image/heic':'heic','image/heif':'heif','image/webp':'webp','image/gif':'gif'})[file.type] || 'jpg';
  }

  // --- upload queue ---
  const queue = [];
  let busy = false;

  function setStatus(text, cls){ const s = $('status'); s.textContent = text; s.className = cls || ''; }

  function addFiles(files){
    for (const f of files){
      if (!f.type.startsWith('image/') && !/\.(heic|heif)$/i.test(f.name)) continue;
      const li = document.createElement('li');
      const img = document.createElement('img');
      img.alt = ''; img.src = URL.createObjectURL(f);
      const tag = document.createElement('span'); tag.className = 'tag'; tag.textContent = 'Waiting';
      li.append(img, tag);
      $('queue').prepend(li);
      queue.push({ file: f, li, tag });
    }
    run();
  }

  async function uploadOne(item){
    const path = ensureFolder() + '/' + Date.now() + '-' + rand(4) + '.' + extFor(item.file);
    const body = await prepare(item.file);
    const finalPath = body === item.file ? path : path.replace(/\.[^.]+$/, '.jpg');
    let lastErr;
    for (let attempt = 0; attempt < 3; attempt++){
      const { error } = await sb.storage.from(C.BUCKET).upload(finalPath, body, {
        contentType: body.type || 'image/jpeg', upsert: false, cacheControl: '3600'
      });
      if (!error) return;
      lastErr = error;
      await new Promise(r => setTimeout(r, 1500 * (attempt + 1)));
    }
    throw lastErr;
  }

  async function run(){
    if (busy) return;
    busy = true;
    renderMeta();
    let failed = 0;
    while (queue.length){
      const item = queue.shift();
      const left = queue.length;
      setStatus('Uploading… ' + (left ? left + ' more after this' : 'last one'));
      item.tag.textContent = 'Uploading';
      item.li.className = '';
      try {
        await uploadOne(item);
        item.li.className = 'done'; item.tag.textContent = 'Sent ✓';
        count++; store.set(KEY + ':count', String(count));
      } catch(e){
        failed++;
        item.li.className = 'failed'; item.tag.textContent = 'Failed – tap to retry';
        const b = document.createElement('button');
        b.setAttribute('aria-label', 'Retry upload');
        b.onclick = () => { b.remove(); item.tag.textContent = 'Waiting'; item.li.className=''; queue.push(item); run(); };
        item.li.append(b);
        console.error(e);
      }
      renderMeta();
    }
    busy = false;
    if (failed) setStatus(failed + ' photo' + (failed===1?'':'s') + ' didn’t upload. Check your signal and tap to retry.', 'err');
    else setStatus('All photos uploaded. Thank you!', 'ok');
  }

  for (const id of ['camera','gallery']){
    $(id).addEventListener('change', e => { addFiles(Array.from(e.target.files || [])); e.target.value = ''; });
  }

  window.addEventListener('beforeunload', e => { if (busy) { e.preventDefault(); e.returnValue = ''; } });
})();
</script>
</body>
</html>
